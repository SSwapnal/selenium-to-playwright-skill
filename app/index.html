<!doctype html>
<!-- GasFlow Demo: a tiny practice app for UI automation. Fictional; no real system. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GasFlow Demo</title>
  <style>
    body { font: 15px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f6f7f9; color: #1d2330; }
    header { background: #1f6f5c; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    main { max-width: 760px; margin: 32px auto; background: #fff; padding: 24px 28px; border-radius: 10px; border: 1px solid #e3e6ea; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input, select { padding: 7px 9px; width: 260px; border: 1px solid #c8ccd2; border-radius: 6px; font: inherit; }
    button { margin-top: 16px; padding: 8px 16px; border: 0; border-radius: 6px; background: #1f6f5c; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    header button { margin: 0; background: #fff; color: #1f6f5c; }
    .error { color: #b00020; margin-top: 12px; min-height: 1.5em; }
    .toast { background: #e3f1ec; color: #1f6f5c; padding: 8px 12px; border-radius: 6px; margin-top: 12px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #e3e6ea; padding: 6px 9px; text-align: left; }
    th { background: #f6f7f9; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <strong>GasFlow Demo</strong>
    <span id="user-bar" hidden><span id="welcome"></span> <button id="logout-btn" type="button">Log out</button></span>
  </header>

  <!-- Login view -->
  <main id="login-view">
    <h1>Sign in</h1>
    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="off">
      <label for="password">Password</label>
      <input id="password" name="password" type="password">
      <br><button id="login-btn" type="submit">Sign in</button>
    </form>
    <div id="login-error" class="error" role="alert"></div>
    <p><small>Users: <code>scheduler / Gas#2026</code> · <code>locked / Gas#2026</code></small></p>
  </main>

  <!-- Nominations view -->
  <main id="nominations-view" hidden>
    <h1>Nominations</h1>
    <form id="nom-form" novalidate>
      <label for="pipeline">Pipeline</label>
      <select id="pipeline">
        <option>Texas Eastern</option>
        <option>Transco</option>
        <option>ANR Pipeline</option>
      </select>
      <label for="quantity">Quantity (Dth)</label>
      <input id="quantity" type="number">
      <br><button id="submit-btn" type="submit">Submit nomination</button>
    </form>
    <div id="nom-error" class="error" role="alert"></div>
    <div id="toast" class="toast" role="status" hidden></div>

    <table id="nom-table">
      <thead><tr><th>ID</th><th>Pipeline</th><th>Quantity (Dth)</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="nom-count">0 nominations</p>
  </main>

  <script>
    // Like a real app, sign-in and submit take a moment (fake server delay).
    const DELAY_MS = 700;
    const $ = (id) => document.getElementById(id);
    let nextId = 1001;

    function showNominations(user) {
      $('login-view').hidden = true;
      $('nominations-view').hidden = false;
      $('user-bar').hidden = false;
      $('welcome').textContent = 'Welcome, ' + user;
    }

    function showLogin() {
      $('nominations-view').hidden = true;
      $('user-bar').hidden = true;
      $('login-view').hidden = false;
      $('login-form').reset();
      $('login-error').textContent = '';
    }

    $('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = $('username').value.trim();
      const pass = $('password').value;
      $('login-error').textContent = '';
      if (!user) { $('login-error').textContent = 'Username is required'; return; }
      $('login-btn').disabled = true;
      $('login-btn').textContent = 'Signing in...';
      setTimeout(() => {
        $('login-btn').disabled = false;
        $('login-btn').textContent = 'Sign in';
        if (pass !== 'Gas#2026' || !['scheduler', 'locked'].includes(user)) {
          $('login-error').textContent = 'Invalid username or password';
        } else if (user === 'locked') {
          $('login-error').textContent = 'Your account is locked. Contact support.';
        } else {
          showNominations(user);
        }
      }, DELAY_MS);
    });

    $('logout-btn').addEventListener('click', showLogin);

    $('nom-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const qty = Number($('quantity').value);
      $('nom-error').textContent = '';
      $('toast').hidden = true;
      if (!(qty > 0)) { $('nom-error').textContent = 'Quantity must be greater than 0'; return; }
      $('submit-btn').disabled = true;
      setTimeout(() => {
        const id = 'N-' + nextId++;
        const row = document.createElement('tr');
        for (const text of [id, $('pipeline').value, qty.toLocaleString('en-US'), 'Submitted']) {
          const td = document.createElement('td');
          td.textContent = text;
          row.appendChild(td);
        }
        $('nom-table').tBodies[0].appendChild(row);
        const count = $('nom-table').tBodies[0].rows.length;
        $('nom-count').textContent = count + (count === 1 ? ' nomination' : ' nominations');
        $('toast').textContent = 'Nomination ' + id + ' submitted';
        $('toast').hidden = false;
        $('submit-btn').disabled = false;
        $('nom-form').reset();
      }, DELAY_MS);
    });
  </script>
</body>
</html>
